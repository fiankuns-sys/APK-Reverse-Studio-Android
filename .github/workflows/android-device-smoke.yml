name: Android v1.0 device smoke (emulator)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-device-smoke.yml'
      - 'tools/android-device-smoke.sh'

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Direct ChatGPT OAuth policy regression
        run: |
          mkdir -p /tmp/apkr-oauth-classes
          javac -d /tmp/apkr-oauth-classes app/src/main/java/id/reverselab/studio/ai/DirectAuthPolicy.java tools/DirectAuthPolicyTest.java
          java -cp /tmp/apkr-oauth-classes DirectAuthPolicyTest
      - name: Back navigation guard regression
        run: |
          mkdir -p /tmp/apkr-back-classes
          javac -d /tmp/apkr-back-classes app/src/main/java/id/reverselab/studio/BackNavigationGuard.java tools/BackNavigationGuardTest.java
          java -cp /tmp/apkr-back-classes BackNavigationGuardTest
      - name: Run an Android 35 emulator and verify APK launch/restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug
            bash tools/android-device-smoke.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.0-build16-emulator-evidence
          path: device-smoke-results/
          if-no-files-found: warn
